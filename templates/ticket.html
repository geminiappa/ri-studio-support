<!DOCTYPE html>

<html>

<head>

<title>
RI Studio Support
</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


<style>

#chat{

display:flex;
flex-direction:column;
gap:12px;
max-height:500px;
overflow-y:auto;
padding:10px;

}


.message{

background:white;

border:1px solid #ddd;

padding:15px;

border-radius:20px;

animation:fade .3s ease;

}


.system{

background:#111;

color:white;

}



@keyframes fade{

from{

opacity:0;
transform:translateY(15px);

}

to{

opacity:1;
transform:translateY(0);

}

}


.rating button{

border:0;

background:#111;

color:white;

padding:12px;

border-radius:20px;

cursor:pointer;

margin:5px;

}


</style>


</head>



<body>



<header class="header">


<div class="logo">

RI Studio

</div>



<div class="nav">


<a href="/">

<button>

← Назад

</button>

</a>



<a href="https://ri-studio-games.onrender.com/" target="_blank">

<button>

Главный сайт

</button>

</a>



</div>


</header>







<section class="hero">



<div class="badge">

● TICKET #{{ticket.id}}

</div>





<h1>

Центр<br>

поддержки.

</h1>





<p>

Тема:

<b>

{{ticket.title}}

</b>

</p>



<p>

Статус:

<b>

{{ticket.status}}

</b>

</p>







<div class="support">



<h2>

💬 Диалог

</h2>




<div id="chat">

</div>





<form id="form">


<textarea

id="text"

placeholder="Ваше сообщение"

></textarea>



<br><br>


<button class="primary">

Отправить

</button>


</form>



</div>







{% if ticket.status=="Закрыт" %}


<div class="support rating">


<h2>

⭐ Оцените поддержку

</h2>


<p>

Спасибо за обращение!

</p>



<form action="/rate/{{ticket.id}}" method="post">


<button name="rating" value="5">
⭐⭐⭐⭐⭐
</button>


<button name="rating" value="4">
⭐⭐⭐⭐
</button>


<button name="rating" value="3">
⭐⭐⭐
</button>


<button name="rating" value="2">
⭐⭐
</button>


<button name="rating" value="1">
⭐
</button>


</form>


</div>


{% endif %}




</section>








<script>


let id={{ticket.id}};

let last=0;



async function load(){


let r=await fetch(
"/messages/"+id
);


let data=await r.json();



let chat=document
.getElementById("chat");



data.forEach(m=>{


if(m.id<=last)

return;


last=m.id;



let div=document.createElement("div");


div.className="message";



if(m.sender=="Система"){

div.classList.add("system");

}



div.innerHTML=

`

<b>

${m.sender}

</b>


<br>


${m.text}


<br>


<small>

${m.date}

</small>

`;



chat.appendChild(div);


});



chat.scrollTop=
chat.scrollHeight;


}



setInterval(
load,
2000
);


load();





document
.getElementById("form")
.addEventListener(
"submit",

async e=>{


e.preventDefault();



let input=document
.getElementById("text");



if(!input.value)

return;



await fetch(

"/ticket/"+id,

{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:

"text="+encodeURIComponent(input.value)

}

);



input.value="";


});


</script>



</body>

</html>
