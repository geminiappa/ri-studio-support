<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RI Studio Support</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>



<header class="header">


<div class="logo">

RI Studio Support

</div>



<div class="header-actions">


<a class="btn btn-light"
href="/">

← Назад

</a>


<a class="btn"
href="https://ri-studio-games.onrender.com/">

Сайт

</a>


</div>


</header>







<main class="container fade">



<div class="badge">

TICKET #{{ticket.id}}

</div>




<h1>

Центр<br>

поддержки.

</h1>





<div class="card">



<h2>

{{ticket.title}}

</h2>



<p>

Статус:

<b>

{{ticket.status}}

</b>

</p>



</div>







<section class="card">



<h2>

💬 Диалог

</h2>





<div id="chat"
class="chat">

</div>







<form id="messageForm">



<textarea

id="text"

placeholder="Введите сообщение..."

></textarea>



<br>



<button class="btn">

Отправить

</button>



</form>




</section>








{% if ticket.status=="Закрыт" %}



<section class="card">



<h2>

⭐ Оцените поддержку

</h2>



<form method="POST"
action="/rate/{{ticket.id}}">


<button class="btn"
name="rating"
value="5">

⭐⭐⭐⭐⭐

</button>



<button class="btn"
name="rating"
value="4">

⭐⭐⭐⭐

</button>



<button class="btn"
name="rating"
value="3">

⭐⭐⭐

</button>



</form>



</section>



{% endif %}





</main>









<script>


let ticketId = {{ticket.id}};

let lastId = 0;



async function loadMessages(){


let response = await fetch(
"/messages/"+ticketId
);


let messages = await response.json();



let chat =
document.getElementById("chat");



messages.forEach(msg=>{


if(msg.id <= lastId)

return;



lastId = msg.id;



let div =
document.createElement("div");



div.classList.add(
"message"
);



if(msg.sender=="Пользователь"){

div.classList.add("user");

}


else if(msg.sender=="Система"){

div.classList.add("system");

}


else{

div.classList.add("admin");

}



div.innerHTML = `

<b>${msg.sender}</b>

<br>

${msg.text}

<br>

<small>

${msg.created || ""}

</small>

`;



chat.appendChild(div);



});



chat.scrollTop =
chat.scrollHeight;


}





setInterval(
loadMessages,
2000
);


loadMessages();







document
.getElementById("messageForm")
.addEventListener(
"submit",

async function(e){


e.preventDefault();



let text =
document.getElementById("text");



if(!text.value)

return;




await fetch(

"/ticket/"+ticketId,

{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:

"text="+encodeURIComponent(text.value)

}

);



text.value="";



}

);



</script>



</body>

</html>
